plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'ch.so.agi'
apply from: "$rootDir/gradle/versioning.gradle"
apply from: "$rootDir/gradle/dependencies.gradle"
apply from: "$rootDir/gradle/docker.gradle"
dependencies {
    implementation project(':netl-mcp-module')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('processResources') {
    inputs.property('mcpServerVersion', version.toString())
    filesMatching('application.properties') { expand(mcpServerVersion: project.version.toString()) }
}
test { useJUnitPlatform { excludeTags 'integration' } }
tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    systemProperty 'netl.workspace', System.getProperty('netl.workspace', file('tests/compose/workspace').absolutePath)
}
bootJar { archiveFileName = 'netl-mcp.jar' }

// Preserve interactive STDIO when developing with bootRun.
tasks.named('bootRun') { standardInput = System.in }
